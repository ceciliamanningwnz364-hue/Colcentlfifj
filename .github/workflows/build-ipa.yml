                              .textContentType(.organizationName)
                          TextField("Имя и должность контакта", text: $draft.contact)
                          TextField("Номер телефона", text: $draft.phone)
                              .textContentType(.telephoneNumber)
                              .keyboardType(.phonePad)
                      }
