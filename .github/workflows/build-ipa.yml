              private func timeline(for lead: Lead) -> [TimelineItem] {
                  let reminders = records.reminders.filter { $0.leadID == lead.id }.map {
                      TimelineItem(
                          id: $0.id, date: $0.due, symbol: $0.completed ? "checkmark.circle" : $0.kind.symbol,
                          title: $0.title, detail: $0.completed ? "Выполнено" : $0.kind.title,
                          edit: .reminder($0)
                      )
                  }
                  let calls = records.calls.filter { $0.leadID == lead.id }.map {
                      TimelineItem(
                          id: $0.id, date: $0.date, symbol: "phone", title: $0.outcome.title,
                          detail: $0.detail, edit: .call($0, completes: nil)
                      )
                  }
                  let notes = records.notes.filter { $0.leadID == lead.id }.map {
                      TimelineItem(
                          id: $0.id, date: $0.updatedAt, symbol: "note.text", title: $0.title,
                          detail: $0.body, edit: .note($0)
                      )
                  }
                  return (reminders + calls + notes).sorted { $0.date > $1.date }
              }

              private func makeReminder(leadID: UUID? = nil) {
                  let kind: ReminderKind = leadID == nil ? .task : .call
                  editor = .reminder(Reminder(leadID: leadID, kind: kind))
              }

              private func dial(_ lead: Lead) {
                  guard let url = lead.dialURL else { return }
                  openURL(url) { accepted in
                      if !accepted {
                          Task { @MainActor in alert = "Устройство не смогло открыть звонок." }
                      }
                  }
              }

              private func toggle(_ reminder: Reminder) {
                  do {
                      try store.save({ records in
                          guard let index = records.reminders.firstIndex(where: { $0.id == reminder.id }) else { return }
                          records.reminders[index].completed.toggle()
                      }, requestNotifications: reminder.completed && reminder.due > Date())
                  } catch {
                      alert = "Не удалось обновить напоминание. Попробуйте ещё раз."
                  }
              }

              private func remove(_ lead: Lead) {
                  do {
                      try store.save { records in
                          records.leads.removeAll { $0.id == lead.id }
                          records.reminders.removeAll { $0.leadID == lead.id }
                          records.calls.removeAll { $0.leadID == lead.id }
                          for index in records.notes.indices where records.notes[index].leadID == lead.id {
                              records.notes[index].leadID = nil
                          }
                      }
                      leadID = nil
                  } catch {
                      alert = "Не удалось удалить лида. Попробуйте ещё раз."
                  }
                  deletingLead = nil
              }

              private func reminderTime(_ date: Date, relativeTo now: Date) -> String {
                  let time = date.formatted(.dateTime.hour().minute().locale(locale))
                  if Calendar.current.isDate(date, inSameDayAs: now) { return time }
                  return date.formatted(.dateTime.day().month(.abbreviated).locale(locale)) + ", " + time
              }

