              var body: some View {
                  EditSheet(title: exists ? "Заметка" : "Новая заметка",
                            canSave: !draft.title.trimmed.isEmpty, save: save) {
                      Section {
                          TextField("Название", text: $draft.title)
                              .font(.headline)
                          TextEditor(text: $draft.body)
                              .frame(minHeight: 150)
                              .accessibilityLabel("Текст заметки")
                      }
                      Section {
                          LeadPicker(selection: $draft.leadID)
                      }
                      if exists {
                          Section {
                              Button("Удалить заметку", role: .destructive) { confirmDelete = true }
                          }
                          .confirmationDialog("Удалить заметку?", isPresented: $confirmDelete, titleVisibility: .visible) {
                              Button("Удалить", role: .destructive, action: remove)
                              Button("Отмена", role: .cancel) {}
                          }
                      }
                      if let actionError { Text(actionError).font(.footnote).foregroundStyle(Palette.amber) }
                  }
              }

              private func save() throws {
                  var note = draft
                  note.title = note.title.trimmed
                  note.body = note.body.trimmed
                  note.updatedAt = Date()
                  try store.save { $0.notes.upsert(note) }
              }

              private func remove() {
                  do {
                      try store.save { $0.notes.removeAll { $0.id == draft.id } }
                      dismiss()
                  } catch {
                      actionError = "Не удалось удалить заметку."
                  }
              }
          }

          @MainActor
          private struct CallEditor: View {
              @EnvironmentObject private var store: Store
              @Environment(\.dismiss) private var dismiss
              @State var draft: CallEntry
              let reminderID: UUID?
              @State private var finishReminder = true
              @State private var scheduleCallback = false
              @State private var callbackDate = Date().addingTimeInterval(86_400)
              @State private var confirmDelete = false
              @State private var actionError: String?

              init(draft: CallEntry, reminderID: UUID?) {
                  _draft = State(initialValue: draft)
                  self.reminderID = reminderID
              }

              private var exists: Bool { store.records.calls.contains { $0.id == draft.id } }

              var body: some View {
                  let validCallback = !scheduleCallback || callbackDate.minuteStart > Date()
                  return EditSheet(title: "Итог звонка",
                                   canSave: store.records.lead(draft.leadID) != nil && validCallback, save: save) {
                      Section("Разговор") {
                          if let lead = store.records.lead(draft.leadID) { Text(lead.name).font(.headline) }
                          Picker("Итог", selection: $draft.outcome) {
                              ForEach(CallOutcome.allCases) { Text($0.title).tag($0) }
                          }
                          TextField("О чём договорились", text: $draft.detail, axis: .vertical)
                              .lineLimit(3...8)
                          DatePicker("Дата и время звонка", selection: $draft.date, displayedComponents: [.date, .hourAndMinute])
                      }
                      if !exists {
                          Section("Следующий шаг") {
                              if reminderID != nil { Toggle("Отметить звонок выполненным", isOn: $finishReminder) }
                              Toggle("Напомнить перезвонить", isOn: $scheduleCallback)
                              if scheduleCallback {
                                  DatePicker("Дата и время", selection: $callbackDate,
                                             in: Date().minuteStart.addingTimeInterval(60)...,
                                             displayedComponents: [.date, .hourAndMinute])
                                  if !validCallback {
                                      Text("Выберите время позже текущего.")
                                          .font(.footnote)
                                          .foregroundStyle(Palette.amber)
                                  }
                              }
                          }
                      } else {
                          Section {
                              Button("Удалить запись", role: .destructive) { confirmDelete = true }
                          }
                          .confirmationDialog("Удалить запись о звонке?", isPresented: $confirmDelete, titleVisibility: .visible) {
                              Button("Удалить", role: .destructive, action: remove)
                              Button("Отмена", role: .cancel) {}
                          }
                      }

                      if let actionError { Text(actionError).font(.footnote).foregroundStyle(Palette.amber) }
                  }
              }

              private func save() throws {
                  var call = draft
                  call.detail = call.detail.trimmed
                  let callback = scheduleCallback && !exists
                  try store.save({ records in
                      records.calls.upsert(call)
                      if finishReminder, let reminderID,
                         let index = records.reminders.firstIndex(where: { $0.id == reminderID }) {
                          records.reminders[index].completed = true
                      }
                      if callback {
                          records.reminders.append(Reminder(
                              leadID: call.leadID, title: "Перезвонить", kind: .call,
                              due: callbackDate.minuteStart
                          ))
                      }
                  }, requestNotifications: callback)
              }

              private func remove() {
                  do {
                      try store.save { $0.calls.removeAll { $0.id == draft.id } }
                      dismiss()
                  } catch {
                      actionError = "Не удалось удалить запись о звонке."
                  }
              }
          }

          private extension Date {
              var minuteStart: Date { Calendar.current.dateInterval(of: .minute, for: self)?.start ?? self }
          }

          private extension Array where Element: Identifiable {
              mutating func upsert(_ item: Element) {
                  if let index = firstIndex(where: { $0.id == item.id }) {
                      self[index] = item
                  } else {
                      append(item)
                  }
              }
          }
          PEREZVON_SWIFT

          python3 <<'PROJECT_PY'
          import json
          import os
          import struct
          import zlib
          from pathlib import Path

          assets = Path("Perezvon/Assets.xcassets")
          app_icon = assets / "AppIcon.appiconset"
          app_icon.mkdir(parents=True)
          info = {"author": "xcode", "version": 1}
          (assets / "Contents.json").write_text(json.dumps({"info": info}), encoding="utf-8")
          (app_icon / "Contents.json").write_text(json.dumps({
              "images": [{"filename": "AppIcon.png", "idiom": "universal", "platform": "ios", "size": "1024x1024"}],
              "info": info,
          }), encoding="utf-8")

          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data))

          size = 1024
          pixels = bytearray()
          background = bytes((26, 69, 54))
          foreground = bytes((244, 242, 222))
          for y in range(size):
              pixels.append(0)
              for x in range(size):
                  dx, dy = x - 512, y - 512
                  radius_squared = dx * dx + dy * dy
                  ring = 253**2 <= radius_squared <= 296**2
                  hand_up = abs(dx) <= 18 and -175 <= dy <= 10
                  hand_right = 0 <= dx <= 151 and abs(dy) <= 18
                  pixels.extend(foreground if ring or hand_up or hand_right else background)
          (app_icon / "AppIcon.png").write_bytes(
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(pixels))
              + chunk(b"IEND", b"")
          )

          spec = {
              "name": "Perezvon",
              "options": {"deploymentTarget": {"iOS": "17.0"}},
              "targets": {
                  "Perezvon": {
                      "type": "application",
                      "platform": "iOS",
                      "sources": ["Perezvon"],
                      "settings": {"base": {
                          "PRODUCT_BUNDLE_IDENTIFIER": os.environ.get("PEREZVON_BUNDLE_ID", "app.perezvon.ios"),
                          "GENERATE_INFOPLIST_FILE": "YES",
                          "INFOPLIST_KEY_CFBundleDisplayName": "Перезвон",
                          "INFOPLIST_KEY_UIApplicationSceneManifest_Generation": "YES",
                          "INFOPLIST_KEY_UILaunchScreen_Generation": "YES",
                          "ASSETCATALOG_COMPILER_APPICON_NAME": "AppIcon",
                          "SWIFT_VERSION": "5.0",
                          "TARGETED_DEVICE_FAMILY": "1",
                          "MARKETING_VERSION": "1.0",
                          "CURRENT_PROJECT_VERSION": os.environ.get("GITHUB_RUN_NUMBER", "1"),
                          "SUPPORTS_MACCATALYST": "NO",
                          "SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD": "NO",
                          "SKIP_INSTALL": "NO",
                      }},
                  },
              },
              "schemes": {"Perezvon": {
                  "build": {"targets": {"Perezvon": "all"}},
                  "archive": {"config": "Release"},
              }},
          }
          Path("project.json").write_text(json.dumps(spec, ensure_ascii=False), encoding="utf-8")
          PROJECT_PY

          xcodegen generate --spec project.json
          xcode_args=(
            -project Perezvon.xcodeproj
            -scheme Perezvon
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$project_dir/DerivedData"
          )

          if [[ -n "${PEREZVON_PROFILE_ID:-}" ]]; then
            xcodebuild "${xcode_args[@]}" \
              -archivePath "$project_dir/Perezvon.xcarchive" \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="$PEREZVON_TEAM_ID" \
              CODE_SIGN_IDENTITY="$PEREZVON_CERT_ID" \
              PROVISIONING_PROFILE_SPECIFIER="$PEREZVON_PROFILE_ID" archive

            xcodebuild -exportArchive \
              -archivePath "$project_dir/Perezvon.xcarchive" \
              -exportPath "$project_dir/export" \
              -exportOptionsPlist "$PEREZVON_EXPORT_OPTIONS"

            ipa="$output_dir/Perezvon.ipa"
            exports=("$project_dir"/export/*.ipa)
            if [[ ${#exports[@]} -ne 1 || ! -f "${exports[0]}" ]]; then
              echo "::error::Xcode did not export exactly one IPA."
              exit 1
            fi
            cp "${exports[0]}" "$ipa"
          else
            xcodebuild "${xcode_args[@]}" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

            app="$project_dir/DerivedData/Build/Products/Release-iphoneos/Perezvon.app"
            executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")"
            /usr/bin/lipo "$app/$executable" -verify_arch arm64
            mkdir Payload
            /usr/bin/ditto "$app" Payload/Perezvon.app
            ipa="$output_dir/Perezvon-unsigned.ipa"
            /usr/bin/ditto -c -k --keepParent Payload "$ipa"
          fi

          python3 - "$ipa" <<'CHECK_PY'
          import plistlib
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as ipa:
              root = "Payload/Perezvon.app/"
              bad_entry = ipa.testzip()
              if bad_entry:
                  sys.exit(f"Bad IPA entry: {bad_entry}")
              info = plistlib.loads(ipa.read(root + "Info.plist"))
              entries = set(ipa.namelist())
              if root + info["CFBundleExecutable"] not in entries:
                  sys.exit("The IPA has no app executable.")
              if info.get("MinimumOSVersion", "").split(".")[0] != "17":
                  sys.exit("Unexpected minimum iOS version.")
              if sys.argv[1].endswith("/Perezvon.ipa"):
                  for entry in ("embedded.mobileprovision", "_CodeSignature/CodeResources"):
                      if root + entry not in entries:
                          sys.exit(f"Signed IPA is missing {entry}.")
          CHECK_PY

          printf 'ipa=%s\n' "$ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to this workflow run
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.ipa }}
          archive: false
          if-no-files-found: error
          retention-days: 14
