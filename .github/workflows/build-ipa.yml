                          Text("Проверьте номер телефона.")
                              .font(.footnote)
                              .foregroundStyle(Palette.amber)
                      }
                      Section("Статус") {
                          Picker("Статус лида", selection: $draft.stage) {
                              ForEach(LeadStage.allCases) { Text($0.title).tag($0) }
                          }
