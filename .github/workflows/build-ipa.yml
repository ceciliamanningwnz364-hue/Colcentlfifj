# Сохраните файл в репозитории как .github/workflows/build-ipa.yml.
# Коммит запускает сборку без подписи. Повторный запуск доступен во вкладке Actions.
# Для подписанного IPA добавьте в Settings → Secrets and variables → Actions:
#   IOS_CERTIFICATE_P12_BASE64 — Apple Distribution .p12, закодированный в Base64
#   IOS_CERTIFICATE_PASSWORD — пароль файла .p12
#   IOS_PROVISIONING_PROFILE_BASE64 — Ad Hoc .mobileprovision, закодированный в Base64
# В профиле должны быть зарегистрированный iPhone и сертификат из .p12.
# Затем выберите Run workflow и включите Sign for iPhone.

name: Build Perezvon IPA

on:
  push:
    paths:
      - .github/workflows/build-ipa.yml
  workflow_dispatch:
    inputs:
      sign_for_iphone:
        description: Sign for iPhone (Apple Ad Hoc)
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: Build iOS application
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Xcode and XcodeGen
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Prepare Apple Ad Hoc signing
        if: inputs.sign_for_iphone == true
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -u
          if [[ -z "$CERTIFICATE" || -z "$PROFILE" ]]; then
            echo "::error::Set IOS_CERTIFICATE_P12_BASE64 and IOS_PROVISIONING_PROFILE_BASE64 in repository Actions secrets."
            exit 1
          fi

          signing_dir="$RUNNER_TEMP/perezvon-signing"
          mkdir -p "$signing_dir"
          chmod 700 "$signing_dir"

          printf '%s' "$CERTIFICATE" | /usr/bin/base64 -D > "$signing_dir/certificate.p12"
          printf '%s' "$PROFILE" | /usr/bin/base64 -D > "$signing_dir/profile.mobileprovision"
          /usr/bin/security cms -D -i "$signing_dir/profile.mobileprovision" > "$signing_dir/profile.plist"

          keychain="$signing_dir/build.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -hex 32)"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 3600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$signing_dir/certificate.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm "$signing_dir/certificate.p12"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          /usr/bin/security list-keychains -d user -s "$keychain"
          /usr/bin/security find-identity -v -p codesigning "$keychain" > "$signing_dir/identities.txt"

          python3 - "$signing_dir" <<'SIGNING_PY'
          import hashlib
          import os
          import plistlib
          import re
          import shutil
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          directory = Path(sys.argv[1])
          with (directory / "profile.plist").open("rb") as stream:
              profile = plistlib.load(stream)
          entitlements = profile["Entitlements"]
          expiration = profile["ExpirationDate"].replace(tzinfo=timezone.utc)
          if expiration <= datetime.now(timezone.utc):
              sys.exit("The Apple provisioning profile has expired.")
          if (entitlements.get("get-task-allow") or not profile.get("ProvisionedDevices")
                  or profile.get("ProvisionsAllDevices")):
              sys.exit("Use an iOS Ad Hoc distribution profile with registered device UDIDs.")

          profile_id = profile["UUID"]
          team_id = profile["TeamIdentifier"][0]
          bundle_id = entitlements["application-identifier"].partition(".")[2]
          if not re.fullmatch(r"[0-9A-Fa-f-]{36}", profile_id):
              sys.exit("Invalid provisioning profile UUID.")
          if not re.fullmatch(r"[A-Z0-9]{10}", team_id):
              sys.exit("Invalid Apple Team ID.")
          if not re.fullmatch(r"[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+", bundle_id):
              sys.exit("Create the Ad Hoc profile for an explicit App ID, without a wildcard.")

          profile_identities = {
              hashlib.sha1(certificate).hexdigest().upper()
              for certificate in profile["DeveloperCertificates"]
          }
          keychain_identities = re.findall(r"\b[0-9A-F]{40}\b", (directory / "identities.txt").read_text())
          cert_id = next((identity for identity in keychain_identities if identity in profile_identities), None)
          if cert_id is None:
              sys.exit("No valid signing identity in the .p12 matches the Ad Hoc profile.")

          for relative in (
              "Library/Developer/Xcode/UserData/Provisioning Profiles",
              "Library/MobileDevice/Provisioning Profiles",
          ):
              profile_dir = Path.home() / relative
              profile_dir.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(directory / "profile.mobileprovision", profile_dir / f"{profile_id}.mobileprovision")

          export_options = directory / "ExportOptions.plist"
          with export_options.open("wb") as stream:
              plistlib.dump({
                  "method": "release-testing",
                  "signingStyle": "manual",
                  "teamID": team_id,
                  "signingCertificate": cert_id,
                  "provisioningProfiles": {bundle_id: profile_id},
              }, stream)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for key, value in {
                  "PEREZVON_BUNDLE_ID": bundle_id,
                  "PEREZVON_TEAM_ID": team_id,
                  "PEREZVON_CERT_ID": cert_id,
                  "PEREZVON_PROFILE_ID": profile_id,
                  "PEREZVON_EXPORT_OPTIONS": str(export_options),
              }.items():
                  print(f"{key}={value}", file=stream)
          SIGNING_PY

      - name: Generate project and build IPA
        id: package
        run: |
          set -u
          project_dir="$RUNNER_TEMP/perezvon-project"
          output_dir="$RUNNER_TEMP/perezvon-output"
          mkdir -p "$project_dir/Perezvon" "$output_dir"
          cd "$project_dir"

          cat > Perezvon/PerezvonApp.swift <<'PEREZVON_SWIFT'
          // PerezvonApp.swift
          // Xcode → iOS App → SwiftUI. iOS 17+.
          // Replace the generated Swift app and ContentView files with this single file.

          import Combine
          import SwiftUI
          import UIKit
          import UserNotifications

          // MARK: - Records

          private enum LeadStage: String, CaseIterable, Codable, Identifiable {
              case new, working, proposal, won, closed

              var id: Self { self }

              var title: String {
                  switch self {
                  case .new: "Новый"
                  case .working: "В работе"
                  case .proposal: "КП отправлено"
                  case .won: "Договор"
                  case .closed: "Закрыт"
                  }
              }
          }

          private enum ReminderKind: String, CaseIterable, Codable, Identifiable {
              case call, task

              var id: Self { self }
              var title: String { self == .call ? "Звонок" : "Задача" }
              var symbol: String { self == .call ? "phone" : "bell" }
          }

          private enum CallOutcome: String, CaseIterable, Codable, Identifiable {
              case answered, noAnswer, callBack, declined

              var id: Self { self }

              var title: String {
                  switch self {
                  case .answered: "Дозвонился"
                  case .noAnswer: "Не ответил"
                  case .callBack: "Просит перезвонить"
                  case .declined: "Отказ"
                  }
              }
          }

          private struct Lead: Codable, Identifiable {
              var id = UUID()
              var name = ""
              var contact = ""
              var phone = ""
              var stage: LeadStage = .new

              var dialURL: URL? {
                  let number = phone.trimmed
                  let hasPrefix = number.hasPrefix("+")
                  let local = hasPrefix ? String(number.dropFirst()) : number
                  guard local.allSatisfy({ "0123456789() -.".contains($0) || $0.isWhitespace }) else { return nil }
                  let digits = local.filter { "0123456789".contains($0) }
                  guard (5...15).contains(digits.count) else { return nil }
                  let prefix = hasPrefix ? "+" : ""
                  return URL(string: "tel:\(prefix)\(digits)")
              }
          }

          private struct Reminder: Codable, Identifiable {
              var id = UUID()
              var leadID: UUID?
              var title = ""
              var kind: ReminderKind = .call
              var due = Date().addingTimeInterval(3_600)
              var completed = false
          }

          private struct Note: Codable, Identifiable {
              var id = UUID()
              var leadID: UUID?
              var title = ""
              var body = ""
              var updatedAt = Date()
          }

          private struct CallEntry: Codable, Identifiable {
              var id = UUID()
              var leadID: UUID
              var outcome: CallOutcome = .answered
              var detail = ""
              var date = Date()
          }

          private struct Records: Codable {
              var leads: [Lead] = []
              var reminders: [Reminder] = []
              var notes: [Note] = []
              var calls: [CallEntry] = []

              func lead(_ id: UUID?) -> Lead? {
                  guard let id else { return nil }
                  return leads.first { $0.id == id }
              }
          }

          private extension String {
              var trimmed: String { trimmingCharacters(in: .whitespacesAndNewlines) }

              func matches(_ query: String) -> Bool {
                  query.isEmpty || localizedStandardContains(query)
              }
          }

          // MARK: - Storage and notifications

          @MainActor
          private final class Store: ObservableObject {
              @Published private(set) var records: Records
              @Published private(set) var notificationWarning: String?
              @Published private(set) var settingsAvailable = false
              let loadWarning: String?

              private let url: URL
              private var notificationWork: Task<Void, Never>?

              init() {
                  let folder = URL.applicationSupportDirectory
                      .appendingPathComponent("Perezvon", isDirectory: true)
                  url = folder.appendingPathComponent("records.json")
                  do {
                      records = try JSONDecoder().decode(Records.self, from: Data(contentsOf: url))
                      loadWarning = nil
                  } catch let error as NSError where error.domain == NSCocoaErrorDomain &&
                      error.code == NSFileReadNoSuchFileError {
                      records = Records()
                      loadWarning = nil
                  } catch {
                      records = Records()
                      loadWarning = "Не удалось открыть сохранённые данные. Перезапустите приложение, чтобы повторить попытку."
                  }
              }

              func save(_ change: (inout Records) -> Void, requestNotifications: Bool = false) throws {
                  guard loadWarning == nil else { throw StorageError.unavailable }
                  var updated = records
                  change(&updated)
                  try FileManager.default.createDirectory(
                      at: url.deletingLastPathComponent(), withIntermediateDirectories: true
                  )
                  try JSONEncoder().encode(updated).write(to: url, options: [.atomic])
                  let activeReminders = Dictionary(uniqueKeysWithValues: updated.reminders
                      .filter { !$0.completed }
                      .map { ($0.id, $0) })
                  let removedAlerts = records.reminders.filter { original in
                      guard !original.completed else { return false }
                      guard let current = activeReminders[original.id] else { return true }
                      return current.due != original.due || current.title != original.title ||
                          current.leadID != original.leadID || current.kind != original.kind
                  }.map { Self.notificationID($0.id) }
                  records = updated
                  if !removedAlerts.isEmpty {
                      UNUserNotificationCenter.current().removeDeliveredNotifications(withIdentifiers: removedAlerts)
                  }
                  syncNotifications(request: requestNotifications)
              }

              func syncNotifications(request: Bool = false) {
                  guard loadWarning == nil else { return }
                  let previous = notificationWork
                  notificationWork = Task { [weak self] in
                      await previous?.value
                      await self?.updateNotifications(request: request)
                  }
              }

              private func updateNotifications(request: Bool) async {
                  let center = UNUserNotificationCenter.current()
                  var status = await center.notificationSettings().authorizationStatus
                  if request && status == .notDetermined {
                      do {
                          _ = try await center.requestAuthorization(options: [.alert, .sound])
                          status = await center.notificationSettings().authorizationStatus
                      } catch {
                          notificationWarning = "Не удалось запросить разрешение на уведомления."
                          settingsAvailable = false
                          return
                      }
                  }

                  let future = records.reminders
                      .filter { !$0.completed && $0.due > Date() }
                      .sorted { $0.due < $1.due }
                  let allowed = status == .authorized || status == .provisional || status == .ephemeral
                  settingsAvailable = status == .denied
                  notificationWarning = !future.isEmpty && !allowed
                      ? "Уведомления о напоминаниях выключены." : nil

                  let pending = await center.pendingNotificationRequests()
                  let existing = Dictionary(uniqueKeysWithValues: pending
                      .filter { $0.identifier.hasPrefix("perezvon.") }
                      .map { ($0.identifier, $0) })
                  let wanted = allowed ? Set(future.map { Self.notificationID($0.id) }) : []
                  let stale = existing.keys.filter { !wanted.contains($0) }
                  if !stale.isEmpty {
                      center.removePendingNotificationRequests(withIdentifiers: Array(stale))
                  }
                  guard allowed else { return }

                  for reminder in future {
                      let identifier = Self.notificationID(reminder.id)
                      let leadName = records.lead(reminder.leadID)?.name
                      let title = reminder.kind == .call ? "Пора позвонить" : "Напоминание"
                      let body = [leadName, reminder.title].compactMap { $0 }.joined(separator: " · ")
                      let stamp = reminder.due.timeIntervalSince1970
                      if let old = existing[identifier]?.content,
                         old.title == title, old.body == body,
                         (old.userInfo["due"] as? NSNumber)?.doubleValue == stamp {
                          continue
                      }
                      let delay = reminder.due.timeIntervalSinceNow
                      guard delay > 0 else { continue }
                      let content = UNMutableNotificationContent()
                      content.title = title
                      content.body = body
                      content.sound = .default
                      content.userInfo = ["reminderID": reminder.id.uuidString, "due": stamp]
                      let trigger = UNTimeIntervalNotificationTrigger(timeInterval: delay, repeats: false)
                      do {
                          try await center.add(UNNotificationRequest(
                              identifier: identifier, content: content, trigger: trigger
                          ))
                      } catch {
                          notificationWarning = "Не удалось запланировать некоторые уведомления. Откройте приложение ещё раз, чтобы повторить попытку."
                      }
                  }
              }

              private static func notificationID(_ id: UUID) -> String {
                  "perezvon." + id.uuidString
              }
          }

          private enum StorageError: LocalizedError {
              case unavailable
              var errorDescription: String? { "Сохранённые данные сейчас недоступны." }
          }

          @MainActor
          private final class ReminderLink: ObservableObject {
              static let shared = ReminderLink()
              @Published var id: UUID?
          }

          final class PerezvonDelegate: NSObject, UIApplicationDelegate, UNUserNotificationCenterDelegate {
              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil
              ) -> Bool {
                  UNUserNotificationCenter.current().delegate = self
                  return true
              }

              nonisolated func userNotificationCenter(
                  _ center: UNUserNotificationCenter,
                  willPresent notification: UNNotification
              ) async -> UNNotificationPresentationOptions {
                  [.banner, .list, .sound]
              }

              nonisolated func userNotificationCenter(
                  _ center: UNUserNotificationCenter,
                  didReceive response: UNNotificationResponse
              ) async {
                  guard let value = response.notification.request.content.userInfo["reminderID"] as? String,
                        let id = UUID(uuidString: value) else { return }
                  await MainActor.run { ReminderLink.shared.id = id }
              }
          }

          // MARK: - App shell

          private enum Palette {
              static let paper = Color(uiColor: UIColor { $0.userInterfaceStyle == .dark
                  ? UIColor(red: 0.09, green: 0.11, blue: 0.09, alpha: 1)
                  : UIColor(red: 0.98, green: 0.97, blue: 0.95, alpha: 1) })
              static let ink = Color.primary
              static let accent = Color(uiColor: UIColor { $0.userInterfaceStyle == .dark
                  ? UIColor(red: 0.69, green: 0.85, blue: 0.72, alpha: 1)
                  : UIColor(red: 0.10, green: 0.27, blue: 0.21, alpha: 1) })
              static let evergreen = Color(red: 0.10, green: 0.27, blue: 0.21)
              static let sage = accent.opacity(0.14)
              static let rule = Color.primary.opacity(0.14)
              static let amber = Color(uiColor: UIColor { $0.userInterfaceStyle == .dark
                  ? UIColor(red: 1, green: 0.77, blue: 0.45, alpha: 1)
                  : UIColor(red: 0.57, green: 0.28, blue: 0.04, alpha: 1) })
          }

          private enum Screen: String, CaseIterable, Identifiable {
              case today = "Сегодня"
              case leads = "Лиды"
              case notes = "Заметки"

              var id: Self { self }

              var symbol: String {
                  switch self {
                  case .today: "calendar"
                  case .leads: "person.2"
                  case .notes: "note.text"
                  }
              }
          }

          private enum EditRoute: Identifiable {
              case lead(Lead)
              case reminder(Reminder)
              case note(Note)
              case call(CallEntry, completes: UUID?)

              var id: String {
                  switch self {
                  case .lead(let value): "lead-\(value.id)"
                  case .reminder(let value): "reminder-\(value.id)"
                  case .note(let value): "note-\(value.id)"
                  case .call(let value, _): "call-\(value.id)"
                  }
              }
          }

          private struct TimelineItem: Identifiable {
              let id: UUID
              let date: Date
              let symbol: String
              let title: String
              let detail: String
              let edit: EditRoute
          }

          @main
          @MainActor
          struct PerezvonApp: App {
              @UIApplicationDelegateAdaptor(PerezvonDelegate.self) private var delegate
              @StateObject private var store = Store()

              var body: some Scene {
                  WindowGroup {
                      Dashboard()
                          .environmentObject(store)
                          .environment(\.locale, Locale(identifier: "ru_RU"))
                          .tint(Palette.accent)
                  }
              }
          }

          @MainActor
          private struct Dashboard: View {
              @EnvironmentObject private var store: Store
              @Environment(\.openURL) private var openURL
              @Environment(\.scenePhase) private var scenePhase
              @ObservedObject private var reminderLink = ReminderLink.shared

              @State private var screen: Screen = .today
              @State private var leadID: UUID?
              @State private var editor: EditRoute?
              @State private var alert: String?
              @State private var deletingLead: Lead?
              @State private var leadQuery = ""
              @State private var noteQuery = ""

              private var records: Records { store.records }
              private var locale: Locale { Locale(identifier: "ru_RU") }

              var body: some View {
                  ScrollView {
                      Group {
                          if let warning = store.loadWarning {
                              VStack(alignment: .leading, spacing: 16) {
                                  heading("Перезвон")
                                  Label(warning, systemImage: "exclamationmark.triangle")
                                      .foregroundStyle(.secondary)
                              }
                          } else {
                              content
                          }
                      }
                      .frame(maxWidth: 580, alignment: .leading)
                      .padding(.horizontal, 22)
                      .padding(.top, 12)
                      .padding(.bottom, 28)
                      .frame(maxWidth: .infinity)
                  }
                  .id(scrollID)
                  .scrollDismissesKeyboard(.interactively)
                  .background(Palette.paper.ignoresSafeArea())
                  .safeAreaInset(edge: .bottom, spacing: 0) { tabBar }
                  .sheet(item: $editor) { route in
                      switch route {
                      case .lead(let draft): LeadEditor(draft: draft)
                      case .reminder(let draft): ReminderEditor(draft: draft)
                      case .note(let draft): NoteEditor(draft: draft)
                      case .call(let draft, let reminderID): CallEditor(draft: draft, reminderID: reminderID)
                      }
                  }
                  .alert("Перезвон", isPresented: Binding(
                      get: { alert != nil }, set: { if !$0 { alert = nil } }
                  )) {
                      Button("ОК") { alert = nil }
                  } message: {
                      Text(alert ?? "")
                  }
                  .confirmationDialog(
                      "Удалить лида?", isPresented: Binding(
                          get: { deletingLead != nil }, set: { if !$0 { deletingLead = nil } }
                      ), titleVisibility: .visible, presenting: deletingLead
                  ) { lead in
                      Button("Удалить лида", role: .destructive) { remove(lead) }
                      Button("Отмена", role: .cancel) {}
                  } message: { _ in
                      Text("История звонков и напоминания будут удалены. Заметки сохранятся.")
                  }
                  .onChange(of: scenePhase, initial: true) { _, phase in
                      if phase == .active { store.syncNotifications() }
                  }
                  .onChange(of: reminderLink.id, initial: true) { _, id in
                      guard let id else { return }
                      reminderLink.id = nil
                      guard let reminder = records.reminders.first(where: { $0.id == id }) else { return }
                      screen = .today
                      editor = .reminder(reminder)
                  }
              }

              private var scrollID: String {
                  screen == .leads ? (leadID?.uuidString ?? screen.rawValue) : screen.rawValue
              }

              @ViewBuilder
              private var content: some View {
                  switch screen {
                  case .today:
                      TimelineView(.everyMinute) { context in today(at: context.date) }
                  case .leads:
                      if let lead = records.lead(leadID) { leadPage(lead) }
                      else { leadsPage }
                  case .notes:
                      notesPage
                  }
              }

              private var tabBar: some View {
                  VStack(spacing: 0) {
                      Divider()
                      HStack(spacing: 0) {
                          ForEach(Screen.allCases) { tab in
                              Button {
                                  if tab == .leads && screen == .leads { leadID = nil }
                                  screen = tab
                              } label: {
                                  VStack(spacing: 4) {
                                      Image(systemName: tab.symbol)
                                          .font(.system(size: 20, weight: screen == tab ? .semibold : .regular))
                                          .accessibilityHidden(true)
                                      Text(tab.rawValue)
                                          .font(.caption.weight(screen == tab ? .semibold : .regular))
                                  }
                                  .frame(maxWidth: .infinity)
                                  .padding(.vertical, 9)
                                  .contentShape(Rectangle())
                                  .foregroundStyle(screen == tab ? Palette.accent : Color.secondary)
                              }
                              .buttonStyle(.plain)
                              .accessibilityAddTraits(screen == tab ? .isSelected : [])
                          }
                      }
                      .frame(maxWidth: 580)
                  }
                  .frame(maxWidth: .infinity)
                  .background(Palette.paper.ignoresSafeArea(edges: .bottom))
              }

              private func today(at now: Date) -> some View {
                  let pending = records.reminders.filter { !$0.completed }.sorted { $0.due < $1.due }
                  let overdue = pending.filter { $0.due < now }
                  let upcoming = pending.filter { $0.due >= now }
                  let next = upcoming.first { $0.kind == .call }
                  let schedule = upcoming.filter { $0.id != next?.id }
                  let completed = records.reminders.filter {
                      $0.completed && Calendar.current.isDate($0.due, inSameDayAs: now)
                  }.sorted { $0.due < $1.due }

                  return VStack(alignment: .leading, spacing: 22) {
                      VStack(alignment: .leading, spacing: 3) {
                          header("Сегодня", addLabel: "Добавить напоминание") {
                              makeReminder()
                          }
                          Text(now.formatted(.dateTime.weekday(.wide).day().month(.wide).locale(locale)).capitalizedFirst)
                              .font(.title3)
                              .foregroundStyle(.secondary)
                      }

                      if let warning = store.notificationWarning {
                          VStack(alignment: .leading, spacing: 8) {
                              Label(warning, systemImage: "bell.slash")
                                  .font(.footnote)
                              Button(store.settingsAvailable ? "Открыть настройки" : "Включить уведомления") {
                                  if store.settingsAvailable,
                                     let url = URL(string: UIApplication.openSettingsURLString) {
                                      openURL(url)
                                  } else {
                                      store.syncNotifications(request: true)
                                  }
                              }
                              .font(.footnote.weight(.semibold))
                          }
                          .foregroundStyle(Palette.accent)
                      }

                      if let next { nextCall(next, now: now) }

                      if !schedule.isEmpty {
                          reminderSection("Дальше", items: schedule, now: now)
                      }

                      if !overdue.isEmpty {
                          VStack(alignment: .leading, spacing: 8) {
                              Label("Просрочено", systemImage: "clock")
                                  .font(.headline)
                                  .foregroundStyle(Palette.amber)
                              ForEach(overdue) { reminder in reminderRow(reminder, now: now) }
                          }
                          .padding(12)
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .background(Palette.amber.opacity(0.10), in: RoundedRectangle(cornerRadius: 16))
                      }

                      if pending.isEmpty {
