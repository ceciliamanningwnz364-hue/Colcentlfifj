          @MainActor
          private struct ReminderEditor: View {
              @EnvironmentObject private var store: Store
              @Environment(\.dismiss) private var dismiss
              @Environment(\.openURL) private var openURL
              @State var draft: Reminder
              @State private var confirmDelete = false
              @State private var actionError: String?

              init(draft: Reminder) {
                  _draft = State(initialValue: draft)
              }

              private var exists: Bool { store.records.reminders.contains { $0.id == draft.id } }

              var body: some View {
                  EditSheet(title: exists ? "Напоминание" : "Новое напоминание",
                            canSave: !draft.title.trimmed.isEmpty, save: save) {
                      Section("Что сделать") {
                          TextField("Например, уточнить по охране", text: $draft.title)
                          Picker("Тип", selection: $draft.kind) {
                              ForEach(ReminderKind.allCases) { Text($0.title).tag($0) }
                          }
                          LeadPicker(selection: $draft.leadID)
                      }
                      Section("Когда") {
                          DatePicker("Дата и время", selection: $draft.due, displayedComponents: [.date, .hourAndMinute])
                          if exists { Toggle("Выполнено", isOn: $draft.completed) }
                      }
                      if exists, draft.kind == .call, let url = store.records.lead(draft.leadID)?.dialURL {
                          Section {
                              Button("Позвонить", systemImage: "phone.fill") {
                                  openURL(url) { accepted in
                                      if !accepted {
                                          Task { @MainActor in actionError = "Устройство не смогло открыть звонок." }
                                      }
                                  }
                              }
                          }
                      }
                      if exists {
                          Section {
                              Button("Удалить напоминание", role: .destructive) { confirmDelete = true }
                          }
                          .confirmationDialog("Удалить напоминание?", isPresented: $confirmDelete, titleVisibility: .visible) {
                              Button("Удалить", role: .destructive, action: remove)
                              Button("Отмена", role: .cancel) {}
                          }
                      }
                      if let actionError { Text(actionError).font(.footnote).foregroundStyle(Palette.amber) }
                  }
              }

              private func save() throws {
                  var reminder = draft
                  reminder.title = reminder.title.trimmed
                  reminder.due = reminder.due.minuteStart
                  try store.save({ $0.reminders.upsert(reminder) },
                                 requestNotifications: !reminder.completed && reminder.due > Date())
              }

              private func remove() {
                  do {
                      try store.save { $0.reminders.removeAll { $0.id == draft.id } }
                      dismiss()
                  } catch {
                      actionError = "Не удалось удалить напоминание."
                  }
              }
          }

